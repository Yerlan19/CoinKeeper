version: '3.8'

services:
  # MariaDB база данных
  mariadb:
    image: mariadb:latest
    container_name: coinkeeper-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-your_password}
      MYSQL_DATABASE: ${DB_NAME:-coinkeeper}
      MYSQL_USER: ${DB_USER:-coinkeeper_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-your_password}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot приложение
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coinkeeper-backend
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-coinkeeper}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-coinkeeper_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-your_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    restart: unless-stopped

volumes:
  mariadb_data:

